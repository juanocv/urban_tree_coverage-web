name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      # Lets the published API address live in a repository variable instead of
      # in the repository. Settings -> Secrets and variables -> Actions ->
      # Variables -> UC_WEB_API_BASE_URL. It is a variable, not a secret: the
      # address is served to every visitor anyway, and the token is what guards
      # the API. When the variable is unset the script leaves the committed
      # config.js alone, so this step is safe to keep either way.
      - name: Apply the published API address
        env:
          UC_WEB_API_BASE_URL: ${{ vars.UC_WEB_API_BASE_URL }}
        run: python3 scripts/sync-config.py

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
